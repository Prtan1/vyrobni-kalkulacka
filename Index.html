<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Výrobní kalkulačka">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    <title>Výrobní kalkulačka</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 15px; background: #eef2f5; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 22px; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 15px; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 18px; text-align: center; background: #fff; }
        input:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.3); }
        button { background: #007bff; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; margin-top: 5px; }
        button:active { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #e2f0d9; border: 1px solid #c3e6cb; border-radius: 8px; font-size: 16px; line-height: 1.6; color: #155724; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .small-hint { font-size: 12px; color: #666; margin-top: 4px; text-align: center; }
        .optional-section { background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px dashed #ccc; margin-bottom: 15px; }

        * { -webkit-tap-highlight-color: transparent; }
        html { background: #eef2f5; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding: max(15px, env(safe-area-inset-top))
                     max(15px, env(safe-area-inset-right))
                     max(15px, env(safe-area-inset-bottom))
                     max(15px, env(safe-area-inset-left));
            box-sizing: border-box;
        }
        input, button { -webkit-appearance: none; appearance: none; }
        input { min-height: 48px; }
        button { min-height: 52px; }
        @media (prefers-color-scheme: dark) {
            html, body { background: #111827; color: #e5e7eb; }
            .card { background: #1f2937; }
            h2, label { color: #f3f4f6; }
            input { background: #111827; color: #f9fafb; border-color: #4b5563; }
            .optional-section { background: #17202d; border-color: #4b5563; }
            .small-hint { color: #9ca3af; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>⚙️ Výrobní kalkulačka</h2>
    
    <div class="row">
        <div class="form-group">
            <label for="celkem">Celkem (kg)</label>
            <input type="number" id="celkem" value="1000">
        </div>
        <div class="form-group">
            <label for="hotovo">Hotovo (kg)</label>
            <input type="number" id="hotovo" value="845">
        </div>
    </div>

    <div class="form-group">
        <label for="uplynuly-cas">Uplynulý čas</label>
        <input type="text" id="uplynuly-cas" value="13:06">
        <div class="small-hint">Zadejte např. <b>13:06</b> nebo čistě v minutách např. <b>786</b></div>
    </div>

    <!-- Nepovinné parametry -->
    <div class="optional-section">
        <div class="row" style="margin-bottom: 0;">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="stroj" style="font-size: 13px;">Stroj (nepov.)</label>
                <input type="number" id="stroj" placeholder="např. 60" style="font-size: 15px; padding: 8px;">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="norma" style="font-size: 13px;">Norma (nepov.)</label>
                <input type="number" id="norma" placeholder="např. 100" style="font-size: 15px; padding: 8px;">
            </div>
        </div>
    </div>

    <button onclick="vypocitat()">Spočítat</button>

    <div class="result" id="vysledek" style="display:none;">
        Výsledek se zobrazí zde...
    </div>
</div>

<script>
function parsujCas(vstup) {
    vstup = vstup.trim();
    if (vstup.includes(':')) {
        let casti = vstup.split(':');
        let h = parseFloat(casti[0]) || 0;
        let m = parseFloat(casti[1]) || 0;
        return h + (m / 60);
    } else {
        let minuty = parseFloat(vstup) || 0;
        return minuty / 60;
    }
}

function vypocitat() {
    let celkem = parseFloat(document.getElementById('celkem').value);
    let hotovo = parseFloat(document.getElementById('hotovo').value);
    
    let vstupCas = document.getElementById('uplynuly-cas').value;
    let celkemHodinUplynule = parsujCas(vstupCas);

    let zbyvaKg = celkem - hotovo;
    let vysledekDiv = document.getElementById('vysledek');
    vysledekDiv.style.display = 'block';

    if (zbyvaKg <= 0) {
        vysledekDiv.innerHTML = "<b>Zakázka je již hotová! 🎉</b>";
        return;
    }

    if (celkemHodinUplynule <= 0 || isNaN(celkemHodinUplynule)) {
        vysledekDiv.innerHTML = "<b>Zadejte platný uplynuly čas.</b>";
        return;
    }

    // Skutečná průměrná rychlost
    let realnaRychlostKgH = hotovo / celkemHodinUplynule;

    // Zbývající čas
    let zbyvaHodinDecimal = zbyvaKg / realnaRychlostKgH;
    let zbyvaHodin = Math.floor(zbyvaHodinDecimal);
    let zbyvaMinut = Math.round((zbyvaHodinDecimal - zbyvaHodin) * 60);

    let textVysledku = 
        `<b>Zbývá vyrobit:</b> ${zbyvaKg} kg<br>` +
        `<b>Průměrné tempo:</b> ${realnaRychlostKgH.toFixed(1)} kg/h<br>`;

    // Pokud uživatel vyplnil stroj a normu, spočítáme i procenta
    let strojVal = parseFloat(document.getElementById('stroj').value);
    let normaVal = parseFloat(document.getElementById('norma').value);
    if (!isNaN(strojVal) && !isNaN(normaVal) && normaVal > 0) {
        let procenta = (strojVal / normaVal) * 100;
        textVysledku += `<b>Stroj jede na:</b> ${procenta.toFixed(0)} % normy<br>`;
    }

    textVysledku += `<hr style="border:0; border-top:1px solid #c3e6cb; margin:8px 0;">` +
                    `<b>Zbývající čas:</b> ${zbyvaHodin} hod. ${zbyvaMinut} min.<br>`;

    // Automatické zjištění aktuálního času z telefonu a přičtení zbývajícího času
    let nyni = new Date();
    let celkemMinutZbývá = (zbyvaHodin * 60) + zbyvaMinut;
    nyni.setMinutes(nyni.getMinutes() + celkemMinutZbývá);

    let den = nyni.getDate();
    let mesic = nyni.getMonth() + 1;
    let rok = nyni.getFullYear();
    let hod = String(nyni.getHours()).padStart(2, '0');
    let min = String(nyni.getMinutes()).padStart(2, '0');

    textVysledku += `<b>Hotovo bude:</b> ${den}.${mesic}.${rok} v ${hod}:${min}`;

    vysledekDiv.innerHTML = textVysledku;
}
</script>

<script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
        }
    </script>
</body>
</html>
